<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài 16. Vòng năng lượng trên Trái Đất. Năng lượng hóa thạch – E-learning KHTN 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#FAF6EE; --surface:#FFFDF8; --surface2:#E8F0EC; --warm:#FCE9D4;
  --ink:#13324A; --text:#2E3D4C; --muted:#5F6B78; --line:#E2D9C6;
  --acc:#E8892B; --acc-ink:#A94F0C; --teal:#1E6F6A;
  --ok:#23825A; --ok-bg:#DDF2E6; --bad:#B23A32; --bad-bg:#F9DEDA;
  --side:#13324A; --side-text:#E6EEF4; --side-muted:#9FB6C8; --side-acc:#F2A65A;
  --shadow:0 1px 2px rgba(19,50,74,.08),0 6px 20px rgba(19,50,74,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E2B; --surface:#172A3A; --surface2:#1C3A3F; --warm:#3A2A1C;
    --ink:#F2EDE3; --text:#D9E2EA; --muted:#9AA9B6; --line:#2C4356;
    --acc:#F2A65A; --acc-ink:#F5B877; --teal:#6CC7BE;
    --ok:#7FDCAA; --ok-bg:#1D3B2E; --bad:#F2928A; --bad-bg:#43211F;
    --side:#0A1621; --side-text:#E6EEF4; --side-muted:#8EA3B5; --side-acc:#F2A65A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1E2B; --surface:#172A3A; --surface2:#1C3A3F; --warm:#3A2A1C;
    --ink:#F2EDE3; --text:#D9E2EA; --muted:#9AA9B6; --line:#2C4356;
    --acc:#F2A65A; --acc-ink:#F5B877; --teal:#6CC7BE;
    --ok:#7FDCAA; --ok-bg:#1D3B2E; --bad:#F2928A; --bad-bg:#43211F;
    --side:#0A1621; --side-text:#E6EEF4; --side-muted:#8EA3B5; --side-acc:#F2A65A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 18px/1.6 'Nunito Sans',Arial,sans-serif}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:'Be Vietnam Pro',Arial,sans-serif;color:var(--ink);line-height:1.25}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;min-height:0}
.side-head{padding:24px 22px 16px}
.side-head p{font-size:14px;color:var(--side-muted)}
.side-head h1{color:#FAF6EE;font-size:19px;margin-top:4px}
.prog{margin:12px 22px 8px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--side-acc);transition:width .4s}
.prog-t{margin:0 22px 12px;font-size:14px;color:var(--side-muted)}
nav{overflow:auto;padding:4px 12px 24px;flex:1}
.grp{font:700 13px 'Nunito Sans',Arial,sans-serif;color:var(--side-acc);margin:16px 10px 6px}
.nav-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:var(--side-text);padding:9px 10px;border-radius:10px;font-size:15.5px;line-height:1.35}
.nav-i:hover{background:rgba(255,255,255,.07)}
.nav-i.cur{background:rgba(242,166,90,.18);color:#FFF}
.nav-i .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--side-muted);margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:800}
.nav-i.done .dot{background:var(--side-acc);border-color:var(--side-acc);color:#13324A}
/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2}
.top .crumb{font-size:15px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.theme-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;font-size:14px}
.page-wrap{flex:1;overflow:auto}
.page{max-width:920px;margin:0 auto;padding:36px 28px 40px;display:flex;flex-direction:column;gap:24px}
.kicker{font:700 15px 'Nunito Sans',Arial,sans-serif;color:var(--acc-ink)}
.page h2{font-size:clamp(28px,4vw,38px)}
.lead{font-size:19px;color:var(--text);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
.card h3{font-size:20px;margin-bottom:8px}
.task{border-left:6px solid var(--acc);background:var(--surface)}
.task .tlabel{font:800 14px 'Nunito Sans',Arial,sans-serif;color:var(--acc-ink);margin-bottom:6px}
.note{background:var(--surface2);border-radius:16px;padding:18px 22px;font-weight:600;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.foot{display:flex;justify-content:space-between;gap:12px;padding:14px 28px;border-top:1px solid var(--line);background:var(--bg)}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:800;background:var(--ink);color:var(--bg)}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.acc{background:var(--acc);color:#13324A}
.btn[disabled]{opacity:.4;cursor:default}
/* flip cards */
.flip{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:left;color:var(--text);min-height:130px;display:flex;flex-direction:column;gap:8px}
.flip b{font:700 18px 'Be Vietnam Pro',Arial,sans-serif;color:var(--ink)}
.flip .hint{font-size:14px;color:var(--muted)}
.flip.open{border-style:solid;border-color:var(--acc);background:var(--warm)}
/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q-t{font:700 19px/1.45 'Be Vietnam Pro',Arial,sans-serif;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--text)}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt .k{font-weight:800;color:var(--acc-ink);flex:none}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 16px;font-weight:600;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);color:var(--ink);border-left:5px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border-left:5px solid var(--bad)}
/* tf / classify rows */
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.row p{flex:1}
.seg{display:flex;gap:6px;flex:none}
.seg button{border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row.ok{border-color:var(--ok);background:var(--ok-bg)}
.row.bad{border-color:var(--bad);background:var(--bad-bg)}
.mark{font-weight:800;font-size:14px;min-width:44px;text-align:right}
/* order */
.pool,.seq{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:12px;border-radius:14px}
.pool{background:var(--surface2)}
.seq{border:2px dashed var(--line)}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:700}
.chip.n{background:var(--warm);border-color:var(--acc)}
/* svg diagram */
.diagram{width:100%;height:auto;display:block;border-radius:16px;background:linear-gradient(#DCEEF7,#F2F8FB)}
:root[data-theme="dark"] .diagram{background:linear-gradient(#183247,#122636)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .diagram{background:linear-gradient(#183247,#122636)}}
.diagram .part{transition:opacity .25s}
.diagram.focus .part{opacity:.25}
.diagram.focus .part.hl{opacity:1}
.stages{display:flex;flex-wrap:wrap;gap:8px}
.stage{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:700}
.stage.on{background:var(--acc);border-color:var(--acc);color:#13324A}
.stage.seen::after{content:" ✓";color:var(--teal)}
.stage.on.seen::after{color:#13324A}
/* chain */
.chain{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.chain .flip{flex:1;min-width:150px;min-height:110px}
.arrow{align-self:center;font-weight:800;color:var(--acc-ink);font-size:22px}
/* stepper */
.steps{display:flex;gap:8px}
.steps span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--acc)}
/* simulator */
.sim{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:stretch}
.sim .card{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.sim .val{font:800 26px 'Be Vietnam Pro',Arial,sans-serif;color:var(--ink)}
.sim .seg button{min-width:72px}
.price{font:800 30px 'Be Vietnam Pro',Arial,sans-serif}
.price.up{color:var(--bad)} .price.down{color:var(--ok)} .price.eq{color:var(--muted)}
/* match */
.match{display:flex;flex-direction:column;gap:10px}
.match select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);max-width:100%}
/* final test */
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav span{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.qnav span.cur{border-color:var(--acc);color:var(--ink)}
.qnav span.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.qnav span.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .big{font:800 64px 'Be Vietnam Pro',Arial,sans-serif;color:var(--ink)}
.review{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.review .row{flex-direction:column;align-items:flex-start;gap:4px}
.hero{background:var(--side);color:#FAF6EE;border-radius:24px;padding:40px 36px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h2{color:#FAF6EE;font-size:clamp(30px,5vw,46px);max-width:15ch}
.hero p{color:#BFD3E0;max-width:52ch}
.hero .sun{position:absolute;right:-90px;top:-90px;width:240px;height:240px;border-radius:50%;background:#F2A65A;opacity:.9}
.hero .ring{position:absolute;right:-140px;top:-140px;width:340px;height:340px;border-radius:50%;border:2px solid #F2A65A;opacity:.4}
.hero > *{position:relative}
.done-badge{display:inline-block;background:var(--ok-bg);color:var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.overlay{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:86%;max-width:330px;z-index:20;transform:translateX(-105%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .menu-btn{display:inline-block}
  .grid4{grid-template-columns:1fr 1fr}
  .grid2,.opts,.sim{grid-template-columns:1fr}
  .page{padding:24px 18px 32px}
  .top,.foot{padding:12px 16px}
  .row{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Mục lục bài học">
    <div class="side-head"><p>KHTN 9 · Phần Vật lí</p><h1>Bài 16. Vòng năng lượng trên Trái Đất. Năng lượng hóa thạch</h1></div>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <p class="prog-t" id="progText">Đã hoàn thành 0/0 mục</p>
    <nav id="nav"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <div class="top">
      <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">☰ Mục lục</button>
      <p class="crumb" id="crumb"></p>
      <button class="theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">Sáng/Tối</button>
    </div>
    <div class="page-wrap" id="wrap"><div class="page" id="page"></div></div>
    <div class="foot">
      <button class="btn sec" id="prevBtn">‹ Trang trước</button>
      <button class="btn" id="nextBtn">Trang sau ›</button>
    </div>
  </main>
</div>
<script>

q": "Vì sao nhiên liệu hóa thạch được coi là nguồn năng lượng không tái tạo?", "o": ["Vì không thể đốt cháy", "Vì không chứa năng lượng", "Vì chỉ có trong nước biển", "Vì hình thành rất chậm và có trữ lượng hữu hạn"], "a": 3, "g": "Tốc độ hình thành nhiên liệu hóa thạch chậm hơn rất nhiều so với tốc độ khai thác."}, {"q": "Đốt nhiều nhiên liệu hóa thạch làm gia tăng khí nào góp phần gây hiệu ứng nhà kính?", "o": ["Khí oxygen", "Khí nitrogen", "Khí carbon dioxide (CO₂)", "Khí helium"], "a": 2, "g": "CO₂ sinh ra từ quá trình đốt nhiên liệu hóa thạch góp phần làm tăng hiệu ứng nhà kính."}, {"q": "Yếu tố nào có thể khiến giá dầu mỏ tăng khi các điều kiện khác không đổi?", "o": ["Nguồn cung dầu mỏ giảm", "Nhu cầu dầu mỏ giảm", "Nguồn cung dầu mỏ tăng", "Chi phí khai thác giảm"], "a": 0, "g": "Khi nguồn cung giảm còn nhu cầu không đổi, giá dầu thường chịu áp lực tăng."}, {"q": "Nhận định nào đúng về việc sử dụng nhiên liệu hóa thạch?", "o": ["Không tạo ra chất gây ô nhiễm", "Cung cấp nhiều năng lượng nhưng có thể gây ô nhiễm môi trường", "Có thể tái tạo nhanh sau khi sử dụng", "Không ảnh hưởng đến khí hậu"], "a": 1, "g": "Nhiên liệu hóa thạch cung cấp nhiều năng lượng nhưng việc đốt có thể gây ô nhiễm và phát thải khí nhà kính."}, {"q": "Gia đình muốn giảm sử dụng điện sản xuất từ nhiên liệu hóa thạch. Biện pháp nào phù hợp nhất?", "o": ["Bật đèn cả ngày", "Dùng thêm thiết bị điện không cần thiết", "Để điều hòa hoạt động khi không có người", "Tắt thiết bị điện khi không sử dụng"], "a": 3, "g": "Tiết kiệm điện giúp giảm nhu cầu phát điện, từ đó có thể giảm nhiên liệu hóa thạch tiêu thụ."}, {"q": "Địa phương có nhiều nắng muốn giảm phụ thuộc nhiên liệu hóa thạch. Giải pháp phù hợp là gì?", "o": ["Tăng đốt than", "Tăng sử dụng máy phát điện chạy dầu", "Lắp đặt hệ thống điện Mặt Trời ở nơi phù hợp", "Ngừng sử dụng tất cả thiết bị điện"], "a": 2, "g": "Điện Mặt Trời khai thác năng lượng tái tạo, giúp thay thế một phần điện từ nhiên liệu hóa thạch."}, {"q": "Nhà máy điện than c let done = new Set(), cur = 0;

/* ---------- reusable activities ---------- */
function mcq(box, item, onRight) {
  const w = el('div', 'q');
  w.appendChild(el('p', 'q-t', item.q));
  const os = el('div', 'opts'); const fb = el('div', 'fb');
  item.o.forEach((t, i) => {
    const b = el('button', 'opt', `<span class="k">${L[i]}.</span><span>${t}</span>`);
    b.onclick = () => {
      if (i === item.a) {
        [...os.children].forEach(x => x.disabled = true);
        b.classList.add('ok');
        fb.className = 'fb show ok'; fb.innerHTML = '<b>Chính xác!</b> ' + (item.g || '');
        onRight && onRight();
      } else {
        b.classList.add('bad'); b.disabled = true;
        fb.className = 'fb show bad'; fb.innerHTML = '<b>Chưa đúng.</b> ' + (item.h || 'Em đọc lại câu hỏi và thử phương án khác nhé.');
      }
    };
    os.appendChild(b);
  });
  w.append(os, fb); box.appendChild(w); return w;
}
function mcqSet(box, items, id) {
  let right = 0;
  items.forEach((it, k) => { const c = el('div', 'card'); mcq(c, it, () => { right++; if (right === items.length) complete(id); }); box.appendChild(c); });
}
function flips(box, items, id, cls = 'grid4') {
  const g = el('div', cls); let opened = 0;
  items.forEach(([t, d]) => {
    const b = el('button', 'flip', `<b>${t}</b><span class="hint">Bấm để xem</span>`);
    b.setAttribute('aria-expanded', 'false');
    b.onclick = () => {
      if (b.classList.contains('open')) return;
      b.classList.add('open'); b.setAttribute('aria-expanded', 'true');
      b.innerHTML = `<b>${t}</b><span>${d}</span>`;
      if (++opened === items.length && id) complete(id);
    };
    g.appendChild(b);
  });
  box.appendChild(g); return g;
}
function choiceRows(box, rows, labels, id, okMsg) {
  // rows: [text, correctIndex, explanation]
  const wrap = el('div', 'q'); const picks = rows.map(() => null);
  const rs = rows.map(([t], k) => {
    const r = el('div', 'row'); r.appendChild(el('p', '', t));
    const seg = el('div', 'seg');
    labels.forEach((lb, j) => { const b = el('button', '', lb); b.onclick = () => { picks[k] = j; [...seg.children].forEach(x => x.classList.toggle('on', x === b)); r.classList.remove('ok', 'bad'); m.textContent = ''; }; seg.appendChild(b); });
    const m = el('span', 'mark'); r.append(seg, m); wrap.appendChild(r); return { r, m };
  });
  const fb = el('div', 'fb'); const chk = el('button', 'btn', 'Kiểm tra');
  chk.onclick = () => {
    if (picks.includes(null)) { fb.className = 'fb show bad'; fb.textContent = 'Em hãy chọn đủ cho tất cả các ý rồi bấm Kiểm tra.'; return; }
    let ok = 0;
    rows.forEach(([t, c, ex], k) => { const good = picks[k] === c; ok += good; rs[k].r.classList.toggle('ok', good); rs[k].r.classList.toggle('bad', !good); rs[k].m.textContent = good ? '✓ Đúng' : '✗ Sai'; });

    else { fb.className = 'fb show bad'; fb.innerHTML = `<b>Đúng ${ok}/${rows.length} ý.</b> Em sửa các ý được đánh dấu sai rồi kiểm tra lại.`; }
  };
  wrap.append(chk, fb); box.appendChild(wrap);
}

page('Kiểm tra', 'kiem-tra', 'Bài kiểm tra cuối bài (15 câu)', b => {
  let order = [], k = 0, ans = [];
  const box = el('div', 'q');
  const start = () => { order = FINAL.map((_, i) => i); k = 0; ans = []; draw(); };
  const draw = () => {
    box.innerHTML = '';
    if (k >= order.length) return result();
    const nav = el('div', 'qnav'); order.forEach((_, i) => nav.appendChild(el('span', i < k ? (ans[i] ? 'ok' : 'bad') : i === k ? 'cur' : '', i + 1)));
    const it = FINAL[order[k]]; const c = el('div', 'card q');
    c.appendChild(el('p', 'kicker', `Câu ${k + 1}/${order.length}`)); c.appendChild(el('p', 'q-t', it.q));
    const os = el('div', 'opts'); const fb = el('div', 'fb'); const nx = el('button', 'btn acc', k === order.length - 1 ? 'Xem kết quả' : 'Câu tiếp ›'); nx.style.display = 'none';
    it.o.forEach((t, i) => { const bt = el('button', 'opt', `<span class="k">${L[i]}.</span><span>${t}</span>`);
      bt.onclick = () => { [...os.children].forEach(x => x.disabled = true); const g = i === it.a; ans[k] = g;
        os.children[it.a].classList.add('ok'); if (!g) bt.classList.add('bad');
        fb.className = 'fb show ' + (g ? 'ok' : 'bad'); fb.innerHTML = (g ? '<b>Chính xác!</b> ' : `<b>Chưa đúng. Đáp án: ${L[it.a]}.</b> `) + it.g; nx.style.display = 'inline-block'; nx.focus(); };
      os.appendChild(bt); });
    nx.onclick = () => { k++; draw(); };
    c.append(os, fb, nx); box.append(nav, c);
  };
  const result = () => {
    const sc = ans.filter(Boolean).length; const ten = Math.round(sc / order.length * 100) / 10;
    const msg = sc >= 13 ? 'Xuất sắc! Em đã nắm rất vững bài học.' : sc >= 10 ? 'Tốt lắm! Em xem lại các câu sai bên dưới nhé.' : sc >= 7 ? 'Khá! Em nên ôn lại những phần còn nhầm.' : 'Em nên học lại các trang trong mục lục rồi làm lại bài kiểm tra.';

    const rv = el('div', 'review'); order.forEach((qi, i) => { if (!ans[i]) { const it = FINAL[qi]; rv.appendChild(el('div', 'row bad', `<p><b>Câu ${i + 1}.</b> ${it.q}</p><p>Đáp án đúng: <b>${L[it.a]}. ${it.o[it.a]}</b></p><p>${it.g}</p>`)); } });
    box.appendChild(r); if (rv.children.length) { box.appendChild(el('h3', '', 'Các câu em làm chưa đúng')); box.appendChild(rv); }

/* ---------- shell ---------- */
const nav = $('#nav');
function renderNav() {
  nav.innerHTML = ''; let g = null;
  P.forEach((p, i) => {
    if (p.grp !== g) { g = p.grp; nav.appendChild(el('p', 'grp', g)); }
    const b = el('button', 'nav-i' + (i === cur ? ' cur' : '') + (done.has(p.id) ? ' done' : ''), `<span class="dot">${done.has(p.id) ? '✓' : ''}</span><span>${p.title}</span>`);
    if (i === cur) b.setAttribute('aria-current', 'page');
    b.onclick = () => { go(i); closeMenu(); }; nav.appendChild(b);
  });
  const n = P.filter(p => done.has(p.id)).length;
  $('#progBar').style.width = (n / P.length * 100) + '%';
  $('#progText').textContent = `Đã hoàn thành ${n}/${P.length} mục`;
}
function go(i) {
  cur = Math.max(0, Math.min(P.length - 1, i)); const p = P[cur];
  const pg = $('#page'); pg.innerHTML = '';
  if (p.id !== 'intro') { pg.appendChild(el('p', 'kicker', p.grp)); pg.appendChild(el('h2', '', p.title)); }
  p.build(pg);
  $('#crumb').textContent = `${cur + 1}/${P.length} · ${p.title}`;
  $('#prevBtn').disabled = cur === 0; $('#nextBtn').disabled = cur === P.length - 1;
  $('#wrap').scrollTop = 0; renderNav();
  if (location.hash !== '#' + p.id) history.replaceState(null, '', '#' + p.id);
}
$('#prevBtn').onclick = () => go(cur - 1);
$('#nextBtn').onclick = () => go(cur + 1);
const side = $('#side'), ov = $('#overlay'), mb = $('#menuBtn');
function closeMenu() { side.classList.remove('open'); ov.classList.remove('show'); mb.setAttribute('aria-expanded', 'false'); }
mb.onclick = () => { side.classList.add('open'); ov.classList.add('show'); mb.setAttribute('aria-expanded', 'true'); };
ov.onclick = closeMenu;
$('#themeBtn').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
addEventListener('hashchange', () => { const i = P.findIndex(p => '#' + p.id === location.hash); if (i >= 0 && i !== cur) go(i); });
const start = P.findIndex(p => '#' + p.id === location.hash);
go(start >= 0 ? start : 0);
</script>
</body>
